name: Build & Release Cross-Platform Native GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up GCC compiler
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\ucrt64\bin") {
            echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Strawberry\c\bin") {
            echo "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows AMD64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/amd64" -Force
          $env:CGO_ENABLED = "1"
          go build -ldflags "-s -w" -o dist/amd64/cloudflared.exe ./cmd/cloudflared

      - name: Package Windows AMD64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "packages" -Force
          Copy-Item "run-gui.bat", "run-gui.vbs", "run-gui.ps1" -Destination "dist/amd64"
          Compress-Archive -Path "dist/amd64/*" -DestinationPath "packages/cloudflared-gui-windows-amd64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: packages/*.zip
          if-no-files-found: ignore

  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build Linux AMD64
        run: |
          mkdir -p dist/linux-amd64 packages
          CGO_ENABLED=1 go build -ldflags "-s -w" -o dist/linux-amd64/cloudflared ./cmd/cloudflared
          tar -czvf packages/cloudflared-gui-linux-amd64.tar.gz -C dist/linux-amd64 cloudflared

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/*.tar.gz
          if-no-files-found: ignore

  build-cross:
    name: Cross-Compile Multi-Arch (386 / ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install fyne-cross & zip
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          go install github.com/fyne-io/fyne-cross@latest

      - name: Build Multi-Arch via fyne-cross
        continue-on-error: true
        run: |
          mkdir -p packages
          # Build Windows 386 and ARM64
          fyne-cross windows -arch=386,arm64 -app-id=com.cloudflare.cloudflared.gui -output=cloudflared ./cmd/cloudflared || true
          # Build Linux 386 and ARM64
          fyne-cross linux -arch=386,arm64 -app-id=com.cloudflare.cloudflared.gui -output=cloudflared ./cmd/cloudflared || true

          sudo chown -R $(id -u):$(id -g) fyne-cross/ packages/ || true

          if [ -d "fyne-cross/bin/windows-386" ]; then
            cp run-gui.bat run-gui.vbs run-gui.ps1 fyne-cross/bin/windows-386/ || true
            zip -j packages/cloudflared-gui-windows-386.zip fyne-cross/bin/windows-386/* || true
          fi
          if [ -d "fyne-cross/bin/windows-arm64" ]; then
            cp run-gui.bat run-gui.vbs run-gui.ps1 fyne-cross/bin/windows-arm64/ || true
            zip -j packages/cloudflared-gui-windows-arm64.zip fyne-cross/bin/windows-arm64/* || true
          fi
          if [ -d "fyne-cross/bin/linux-386" ]; then
            tar -czvf packages/cloudflared-gui-linux-386.tar.gz -C fyne-cross/bin/linux-386 cloudflared || true
          fi
          if [ -d "fyne-cross/bin/linux-arm64" ]; then
            tar -czvf packages/cloudflared-gui-linux-arm64.tar.gz -C fyne-cross/bin/linux-arm64 cloudflared || true
          fi

      - name: Upload Cross Packages
        uses: actions/upload-artifact@v4
        with:
          name: cross-packages
          path: packages/*
          if-no-files-found: ignore
        continue-on-error: true

  release:
    name: Publish Release to GitHub
    needs: [build-windows, build-linux, build-cross]
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Cloudflared Native GUI ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*
